- name: disabling the current nodejs
  ansible.builtin.command: dnf module disable nodejs -y

- name: enabling the nodejs20
  ansible.builtin.command: dnf module enable nodejs:20 -y

- name: Installing the nodejs
  ansible.builtin.package:
    name: "{{ item }}"
    state: present
  loop:
  - nodejs
  - mysql

- name: Install mysql libraries
  ansible.builtin.pip:
    name: "{{ item }}"
    executable: pip3.9
  loop:
  - cryptography
  - PyMySQL

- name: Create expense user
  ansible.builtin.user:
    name: expense

- name: setting up the app directory
  ansible.builtin.file:
    path: /app
    state: directory

- name: Download the backend code
  ansible.builtin.get_url:
    url: https://expense-builds.s3.us-east-1.amazonaws.com/expense-backend-v2.zip
    dest: /tmp/backend.zip

- name: unzipping the code
  ansible.builtin.unarchive:
    src: /tmp/backend.zip
    dest: /app
    remote_src: yes

- name: installing the dependencies
  community.general.npm:
    path: /app

- name: Copy file with owner and permissions
  ansible.builtin.template:
    src: backend.service.j2
    dest: /etc/systemd/system/backend.service

- name: Loading the schema to database
  community.mysql.mysql_db:
    name: all
    state: import #import the schema
    login_user: "{{ MYSQL_USER }}"
    login_password: "{{ MYSQL_PASSWORD }}"
    login_host: "{{ MYSQL_HOST }}"
    target: /app/schema/backend.sql

- name: deamon reload and restart service
  ansible.builtin.systemd_service:
    enabled: true
    state: restarted
    daemon_reload: true
    name: backend