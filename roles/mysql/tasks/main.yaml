- name: Install mysql libraries
  ansible.builtin.pip:
    name: "{{ item }}"
    executable: pip3.9
  loop:
  - cryptography
  - PyMySQL
  - boto3
  - botocore

- name: install mysql server
  ansible.builtin.package:
    name: mysql-server
    state: installed

- name: start and enable the server
  ansible.builtin.service:
    name: mysqld
    state: started
    enabled: yes

- name: connect to mysql server
  community.mysql.mysql_info:
    login_user: root
    login_password: "{{ lookup('amazon.aws.aws_ssm', '/expense/mysql/mysql-root-password', decrypt=True ) }}"
    login_host: mysql.rushhav.fun
  register: mysql_info
  ignore_errors: true

- name: setup root password
  ansible.builtin.command: "mysql_secure_installation --set-root-pass {{ lookup('amazon.aws.aws_ssm', '/expense/mysql/mysql-root-password', decrypt=True ) }}"
  when: mysql_info.failed is true

- name: print the output
  ansible.builtin.debug:
    msg: "MYSQL info {{ mysql_info }}"